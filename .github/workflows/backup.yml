name: Backup Dev.to Posts

on:
  # Monthly automated backup on the 1st of each month at 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download posts from Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 scripts/backup.py

      - name: Commit and push changes
        run: |
          git config user.name "dev-to-backup[bot]"
          git config user.email "noreply@github.com"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "Backup Dev.to posts - $(date -u +'%Y-%m-%d')"
            git push
          fi
