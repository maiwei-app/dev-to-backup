name: Backup Dev.to Posts

on:
  # Monthly automated backup on the 1st of each month at 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python code
        run: ruff check scripts/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --cov=scripts --cov-fail-under=75

      - name: Download posts from Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 scripts/backup.py

      - name: Validate Markdown quality
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "dev-to-backup[bot]"
          git config user.email "noreply@github.com"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "Backup Dev.to posts - $(date -u +'%Y-%m-%d')"
            git push
          fi
