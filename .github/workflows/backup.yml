name: Backup Dev.to Posts

on:
  # Monthly automated backup on the 1st of each month at 00:00 UTC
  schedule:
    - cron: '0 0 1 * *'
  # Manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: -r requirements.txt

      - name: Install dev dependencies
        run: |
          pip install --only-binary=:all: -r requirements-dev.txt

      - name: Lint Python code
        run: ruff check scripts/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --cov=scripts --cov-fail-under=75

      - name: Download posts from Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 scripts/backup.py

      - name: Validate Markdown quality
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
        continue-on-error: true

      - name: Generate maibot-app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAIBOT_APP_ID }}
          private-key: ${{ secrets.MAIBOT_APP_PRIVATE_KEY }}

      - name: Open backup PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "F Colomer"
          git config user.email "colomr@pm.me"
          git add -A
          if git diff --quiet --cached; then
            echo "No changes to back up"
            exit 0
          fi
          branch="backup/$(date -u +'%Y-%m-%d')"
          git checkout -b "$branch"
          git commit -m "chore(backup): sync Dev.to posts for $(date -u +'%Y-%m-%d')"
          git push origin "$branch"
          gh pr create \
            --title "chore(backup): sync Dev.to posts for $(date -u +'%Y-%m-%d')" \
            --body "Automated monthly backup of Dev.to posts." \
            --base main --head "$branch"
